# --- SEGURANÇA (OBRIGATÓRIO) ---
# Remova o # dessas duas linhas abaixo:
jwt.secret=${JWT_SECRET:bWV1U2VncmVkb011aXRvU2VndXJvUGFyYUp3dEFwaTIwMjQ=}
jwt.expiration=3600000

# --- CONFIGURAÇÃO H2 (ATIVO) ---
spring.datasource.url=jdbc:h2:mem:extratodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console do H2
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# --- CONFIGURAÇÃO SPRING AI / OPENAI ---
# Necessário para o autoconfigure do Spring AI não falhar no startup
spring.ai.openai.api-key=${OPENAI_API_KEY:chave-nao-configurada}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1000


